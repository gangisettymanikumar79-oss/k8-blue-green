apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-blue
  labels:
    Version: blue
    api: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      Version: blue
      api: nginx
  template:
    metadata:
      labels:
       Version: blue
      api: nginx
    spec:
      containers:
      - name: nginx
        image: manigangisetty/blue-green:0.1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
